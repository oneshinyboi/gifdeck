[package]
name = "gifdeck"
version = "0.2.0"
edition = "2021"
description = "A Rust + ratatui GIF picker backed by GIPHY/KLIPY and a self-hosted favorites server"
license = "GPL-3.0-only"
repository = "https://github.com/oneshinyboi/gifdeck"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["gif", "png"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
wiremock = "0.6.5"
