# Packit builds Fedora RPMs in Copr from GitHub releases.
#
# Setup (one-time):
#   1. Install the Packit GitHub app on this repository
#      (https://github.com/apps/packit-as-a-service) — already installed.
#   2. Copr account: Shinediamond295 (owner below must match it).
# After the first release tagged v* you can enable the repo with:
#   dnf copr enable <owner>/gifdeck
#   dnf install gifdeck
specfile_path: rpm/gifdeck.spec
upstream_project_url: https://github.com/oneshinyboi/gifdeck
upstream_package_name: gifdeck
downstream_package_name: gifdeck

actions:
  get-current-version:
    - sh -c "grep -m1 '^version' Cargo.toml | sed 's/.*\"\([0-9.]*\)\".*/\1/'"
  create-archive:
    # git archive alone would emit only the vendor/ gitlink (empty dir), so:
    # init the submodule (github fetch is the proven-good network path in
    # Copr's SRPM-prep chroot), stage the tree, copy vendor in, tar manually.
    - sh -c "set -e
        && git submodule update --init --depth 1 vendor >/dev/null
        && rm -rf /tmp/gifdeck-stage && mkdir -p /tmp/gifdeck-stage
        && git archive --prefix=gifdeck-${PACKIT_PROJECT_VERSION}/ HEAD | tar -x -C /tmp/gifdeck-stage
        && mkdir -p /tmp/gifdeck-stage/gifdeck-${PACKIT_PROJECT_VERSION}/vendor
        && cp -a vendor/. /tmp/gifdeck-stage/gifdeck-${PACKIT_PROJECT_VERSION}/vendor/
        && rm -f /tmp/gifdeck-stage/gifdeck-${PACKIT_PROJECT_VERSION}/vendor/.git
        && mkdir -p /tmp/gifdeck-stage/gifdeck-${PACKIT_PROJECT_VERSION}/.cargo
        && cp rpm/cargo-vendor-config.toml /tmp/gifdeck-stage/gifdeck-${PACKIT_PROJECT_VERSION}/.cargo/config.toml
        && tar -czf gifdeck-${PACKIT_PROJECT_VERSION}.tar.gz -C /tmp/gifdeck-stage gifdeck-${PACKIT_PROJECT_VERSION}
        && echo gifdeck-${PACKIT_PROJECT_VERSION}.tar.gz"

jobs:
  - job: copr_build
    trigger: release
    owner: shinediamond295
    project: gifdeck
